name: Bug report
description: Report something in ZeusTek Diving that is broken, incorrect, or behaving differently from expected.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail to reproduce the problem safely. Do not include passwords, API keys, OAuth tokens, medical documents, or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: What is wrong?
      placeholder: The app shows the wrong value...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Overview / navigation
        - Insights / analytics
        - Logbook / dive editor
        - Dive computer imports
        - Sites / maps
        - People
        - Dive Centres
        - Albums / media
        - Calendar / trips
        - Dive Planning / Gas Planning
        - Equipment / loadouts / cylinders
        - Certifications / planned training
        - Dive Skills / Technical Diving
        - Professional Development / DMT
        - Dive Knowledge / bibliography / news
        - Data / backups / export / sync
        - PWA / offline
        - Accessibility / responsive layout
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / Sites version
      placeholder: app 1.0.57 / Sites129
  - type: input
    id: page
    attributes:
      label: Page / route / URL
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
  - type: dropdown
    id: data
    attributes:
      label: Does this appear to affect saved data?
      options:
        - No - display/behaviour only
        - Possibly
        - Yes - records appear changed, missing, or duplicated
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: calculations
    attributes:
      label: Are calculations involved?
      options:
        - No
        - Yes - gas / SAC / RMV
        - Yes - decompression / planning
        - Yes - analytics / derived values
        - Yes - other calculation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Cosmetic only
        - Minor inconvenience
        - Feature partly unusable
        - Feature completely unusable
        - Data integrity / corruption risk
        - Security / privacy concern
        - Release blocker
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Device, browser, console errors, or other context
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I checked for an existing report.
          required: true
        - label: I have not included secrets or sensitive private data.
          required: true
